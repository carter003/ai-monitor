[package]
name = "ai-monitor"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "A standalone Linux terminal dashboard for system resources and AI quotas"
license = "MIT"

[dependencies]
herdr-usage = { path = "../herdr-usage" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

