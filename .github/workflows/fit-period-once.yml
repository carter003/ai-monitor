name: One-shot paired-cell lint correction
on:
  push:
    branches: [agent/fixed-bucket-charts-20260912]
    paths: [.github/workflows/fit-period-once.yml]
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == 'carter003/ai-monitor' && github.ref == 'refs/heads/agent/fixed-bucket-charts-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-bucket-charts-20260912
      - name: Apply the exact lint suggestion without changing chart behaviour
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ai-monitor/src/ui/token.rs')
          s = p.read_text()
          old = 'owners.chunks_exact(2)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'owners.as_chunks::<2>().0'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ai-monitor/src/ui/token.rs
          git commit -m 'fix(ui): use typed half-cell pairs for the Clippy check'
          git push origin HEAD:refs/heads/agent/fixed-bucket-charts-20260912
