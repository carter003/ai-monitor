name: One-shot paired-cell lint correction
on:
  push:
    branches: [agent/fixed-bucket-charts-20260912]
    paths: [.github/workflows/fit-period-once.yml]
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == 'carter003/ai-monitor' && github.ref == 'refs/heads/agent/fixed-bucket-charts-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-bucket-charts-20260912
      - name: Apply exact equivalent lint suggestions
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          for filename, old, new in [
              ('crates/ai-monitor/src/ui/token.rs', 'owners.chunks_exact(2)', 'owners.as_chunks::<2>().0'),
              ('crates/ai-monitor/src/ui/token/tests.rs', 'if quarter % 4 == 0 {', 'if quarter.is_multiple_of(4) {'),
          ]:
              p = Path(filename)
              s = p.read_text()
              assert s.count(old) <= 1
              assert old in s or new in s
              p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ai-monitor/src/ui/token.rs crates/ai-monitor/src/ui/token/tests.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): use typed half-cell pairs and exact multiple predicates'
          git push origin HEAD:refs/heads/agent/fixed-bucket-charts-20260912
