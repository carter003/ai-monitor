name: One-shot full-period chart formatting
on:
  push:
    branches: [agent/fixed-bucket-charts-20260912]
    paths: [.github/workflows/fit-period-once.yml]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'carter003/ai-monitor' && github.ref == 'refs/heads/agent/fixed-bucket-charts-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-bucket-charts-20260912
      - name: Guard against concurrent branch updates
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply scoped source correction
        run: |
          python3 .github/scripts/fit-period-once.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ai-monitor/src/ui/token.rs')
          s = p.read_text()
          old = 'labels[row].push_str(&" ".repeat(start.saturating_sub(columns(&labels[row]))));'
          new = 'let padding = start.saturating_sub(columns(&labels[row]));\n            labels[row].push_str(&" ".repeat(padding));'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
      - name: Commit only reviewed source files and remove the patch script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ai-monitor/src/main.rs crates/ai-monitor/src/ui.rs crates/ai-monitor/src/ui/token.rs crates/ai-monitor/src/ui/token/tests.rs .github/scripts/fit-period-once.py
          git diff --cached --stat
          git commit -m 'fix(charts): fit every native bucket into the full time axis without horizontal scrolling'
          git push origin HEAD:refs/heads/agent/fixed-bucket-charts-20260912
