name: One-shot fixed-bucket source formatting

on:
  push:
    branches: [agent/fixed-bucket-charts-20260912]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'carter003/ai-monitor' && github.ref == 'refs/heads/agent/fixed-bucket-charts-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply hash-guarded source edits
        run: python3 scripts/agent-fixed-buckets-once.py
      - name: Format source with Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all
          git diff --check
      - name: Commit only UI changes and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ai-monitor/src/ui.rs crates/ai-monitor/src/ui/token.rs crates/ai-monitor/src/ui/token/tests.rs crates/ai-monitor/src/main.rs
          git rm scripts/agent-fixed-buckets-once.py .github/workflows/fixed-buckets-once.yml
          git diff --cached --stat
          git commit -m 'fix(ui): restore native quarter-hour and six-hour bars with centred ticks and colour bands'
      - name: Fast-forward the authorised repair branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/agent/fixed-bucket-charts-20260912
