name: One-shot uniform chart formatting
on:
  push:
    branches: [agent/uniform-bars-money-line-20260912]
    paths: [.github/workflows/uniform-charts-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'carter003/ai-monitor' && github.ref == 'refs/heads/agent/uniform-bars-money-line-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uniform-bars-money-line-20260912
      - name: Apply exact-source patch
        run: python3 .github/scripts/uniform-charts-once.py
      - name: Format Rust sources
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
      - name: Commit only chart sources and remove one-shot files
        run: |
          test "${GITHUB_REF}" = refs/heads/agent/uniform-bars-money-line-20260912
          git add crates/ai-monitor/src/ui/token.rs crates/ai-monitor/src/ui/token/tests.rs crates/ai-monitor/src/ui/token/money_line.rs
          git rm .github/scripts/uniform-charts-once.py .github/workflows/uniform-charts-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix(charts): use constant zero-gap pitch and dotted amount series'
          git push origin HEAD:refs/heads/agent/uniform-bars-money-line-20260912
