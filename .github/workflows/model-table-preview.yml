name: Model table preview (no PR)

on:
  push:
    branches: [preview/model-usage-25char-20260912]

permissions:
  contents: read

concurrency:
  group: model-table-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and record revision
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          mkdir -p /tmp/model-previews
          git rev-parse HEAD | tee /tmp/model-previews/commit.txt
          rustc --version | tee /tmp/model-previews/toolchain.txt
          cargo --version | tee -a /tmp/model-previews/toolchain.txt
      - uses: Swatinem/rust-cache@v2
      - name: Normalize and verify formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --binary > /tmp/model-previews/formatting.patch
      - name: Workspace tests
        run: cargo test --workspace --locked 2>&1 | tee /tmp/model-previews/tests.log
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/model-previews/clippy.log
      - name: Export real Ratatui Crossterm fixtures
        if: success() || failure()
        env:
          MODEL_PREVIEW_DIR: /tmp/model-previews
        run: cargo test -p ai-monitor --locked export_real_model_table_terminal_fixtures -- --nocapture 2>&1 | tee /tmp/model-previews/export.log
      - name: Install GTK VTE terminal renderer
        if: success() || failure()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-vte-2.91 xvfb xauth fonts-noto-cjk
      - name: Capture real terminal screenshots
        if: success() || failure()
        run: xvfb-run -a -s '-screen 0 2400x1400x24' /usr/bin/python3 scripts/capture_chart_vte.py /tmp/model-previews
      - name: Preserve tested source and diff
        if: always()
        run: |
          git diff 086107f0d118ce243515f34ebacfa4b02f1e7f16 -- . ':!.github/workflows/model-table-preview.yml' > /tmp/model-previews/changes.patch
          tar --exclude=.git --exclude=target -czf /tmp/model-previews/source-tested.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-table-terminal-previews
          path: /tmp/model-previews
          retention-days: 7
